name: eval-gate
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: ticket_triage }
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.12" 
          
      - run: pip install -r backend/requirements.txt
      
      # These scripts will be built as part of the upcoming Epics
      - run: python backend/scripts/seed_kb.py
      - run: python backend/scripts/run_eval.py --provider ollama
      - run: python backend/scripts/check_gate.py
